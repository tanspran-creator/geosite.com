<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Live Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; background:#0f172a; color:white; text-align:center; font-family:Arial; }
button { margin:15px; padding:14px; font-size:18px; border:none; border-radius:10px; background:#22c55e; color:white; }
#map { height:65vh; }
</style>
</head>

<body>

<h2>📡 Tracking LIVE</h2>
<button onclick="start()">DÉMARRER</button>

<p id="status">Standby</p>
<p id="coords"></p>
<p id="address"></p>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

// 🔥 TES CLÉS
firebase.initializeApp({
  apiKey: "AIzaSyAgwaKZKvLOW_GYpVirgywWETM4Kjz3dVQ",
  authDomain: "mymaponline-d4fcf.firebaseapp.com",
  projectId: "mymaponline-d4fcf",
  storageBucket: "mymaponline-d4fcf.appspot.com",
  messagingSenderId: "294259967332",
  appId: "1:294259967332:web:d81f81f5122ff5ef626671"
});

const db = firebase.firestore();

let map, marker;
let watchId = null;

function start() {

  const status = document.getElementById("status");

  if (location.protocol !== "https:") {
    status.innerText = "❌ HTTPS requis";
    return;
  }

  status.innerText = "🚀 Tracking en cours...";

  // 🔥 WATCH = instant + continu
  watchId = navigator.geolocation.watchPosition(onSuccess, onError, {
    enableHighAccuracy: false,   // ⚡ rapide
    maximumAge: 30000,           // ⚡ instant (cache)
    timeout: 5000
  });
}

function onSuccess(pos) {

  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;

  document.getElementById("coords").innerText =
    lat + " , " + lon;

  // 🗺️ MAP instant
  if (!map) {
    map = L.map('map').setView([lat, lon], 16);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
      .addTo(map);

    marker = L.marker([lat, lon]).addTo(map);
  } else {
    marker.setLatLng([lat, lon]);
    map.panTo([lat, lon]);
  }

  // 🔥 FIREBASE INSTANT (sans attendre)
  db.collection("live").add({
    lat: lat,
    lon: lon,
    t: Date.now()
  });

  // 🌍 GEOAPIFY en arrière-plan (optionnel)
  fetch(`https://api.geoapify.com/v1/geocode/reverse?lat=${lat}&lon=${lon}&apiKey=708354c5ad334d41b0611f73996998e1`)
    .then(r => r.json())
    .then(d => {
      const addr = d.features?.[0]?.properties?.formatted || "";
      document.getElementById("address").innerText = addr;
    });

}

function onError(err) {

  const status = document.getElementById("status");

  if (err.code === 1) {
    status.innerText = "❌ REFUS NAVIGATEUR";
  } else if (err.code === 2) {
    status.innerText = "❌ POSITION INDISPONIBLE";
  } else if (err.code === 3) {
    status.innerText = "❌ TIMEOUT";
  } else {
    status.innerText = "❌ ERREUR";
  }

  console.log(err);
}

</script>

</body>
</html>
