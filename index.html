<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Live Position</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

button {
  margin-top:20px;
  padding:12px 20px;
  font-size:16px;
  border:none;
  border-radius:8px;
  background:#3b82f6;
  color:white;
}

#map {
  height:60vh;
  margin-top:20px;
}

#info {
  margin-top:10px;
}
</style>
</head>

<body>

<h2>📍 Partager ma position</h2>

<button id="btn">ACTIVER LA LOCALISATION</button>

<div id="info">
  <p id="coords">En attente...</p>
  <p id="address">Adresse inconnue</p>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAgwaKZKvLOW_GYpVirgywWETM4Kjz3dVQ",
    authDomain: "mymaponline-d4fcf.firebaseapp.com",
    projectId: "mymaponline-d4fcf",
    storageBucket: "mymaponline-d4fcf.firebasestorage.app",
    messagingSenderId: "294259967332",
    appId: "1:294259967332:web:d81f81f5122ff5ef626671",
    measurementId: "G-4M4S7687W5"
  };

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.db = db;
window.setDoc = setDoc;
window.doc = doc;
</script>

<script>
let map, marker;
let userId = localStorage.getItem("id") || crypto.randomUUID();
localStorage.setItem("id", userId);

document.getElementById("btn").addEventListener("click", () => {

  if (!navigator.geolocation) {
    alert("Géolocalisation non supportée");
    return;
  }

  document.getElementById("coords").innerText = "Demande GPS...";

  navigator.geolocation.getCurrentPosition(async (pos) => {

    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    document.getElementById("coords").innerText =
      `Lat: ${lat} | Lon: ${lon}`;

    // MAP
    if (!map) {
      map = L.map('map').setView([lat, lon], 15);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: "© OpenStreetMap"
      }).addTo(map);

      marker = L.marker([lat, lon]).addTo(map);
    } else {
      map.setView([lat, lon]);
      marker.setLatLng([lat, lon]);
    }

    // GEOAPIFY (adresse)
    try {
      const res = await fetch(
        `https://api.geoapify.com/v1/geocode/reverse?lat=${lat}&lon=${lon}&apiKey=708354c5ad334d41b0611f73996998e1`
      );

      const data = await res.json();
      const address = data.features?.[0]?.properties?.formatted || "Adresse inconnue";

      document.getElementById("address").innerText = address;

      // FIREBASE SAVE
      await window.setDoc(
        window.doc(window.db, "positions", userId),
        {
          lat,
          lon,
          address,
          time: new Date().toISOString()
        }
      );

    } catch (e) {
      console.log("Erreur API", e);
    }

  }, (err) => {

    if (err.code === 1) {
      alert("❌ Autorisation refusée → autorise la localisation dans Chrome");
    } else {
      alert("❌ Erreur GPS");
    }

  }, {
    enableHighAccuracy: true,
    timeout: 10000,
    maximumAge: 0
  });

});
</script>

</body>
</html>
