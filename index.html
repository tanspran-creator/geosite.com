<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Live Position</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0f172a;
  color:white;
}

header {
  text-align:center;
  padding:12px;
}

#map {
  height:70vh;
  width:100%;
}

#info {
  padding:10px;
  text-align:center;
}

button {
  padding:10px 16px;
  border:none;
  border-radius:8px;
  background:#3b82f6;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<header>📍 Ma position en direct</header>

<div id="info">
  <button onclick="start()">Partager ma position</button>
  <p id="coords">En attente...</p>
  <p id="address">Adresse inconnue</p>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">
// ================= FIREBASE =================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "TON_API_KEY",
  authDomain: "TON_PROJECT.firebaseapp.com",
  projectId: "TON_PROJECT",
  storageBucket: "TON_PROJECT.appspot.com",
  messagingSenderId: "XXX",
  appId: "XXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.db = db;
window.setDoc = setDoc;
window.doc = doc;
</script>

<script>
let map;
let marker;
let userId = localStorage.getItem("id") || crypto.randomUUID();
localStorage.setItem("id", userId);

// ================= MAP =================
function initMap(lat, lon){
  map = L.map('map').setView([lat, lon], 16);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'© OpenStreetMap'
  }).addTo(map);

  marker = L.marker([lat, lon]).addTo(map);
}

// ================= START =================
function start(){
  navigator.geolocation.watchPosition(async (pos) => {

    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    document.getElementById("coords").innerText =
      `Lat: ${lat} | Lon: ${lon}`;

    if(!map){
      initMap(lat, lon);
    } else {
      map.setView([lat, lon]);
      marker.setLatLng([lat, lon]);
    }

    // ================= GEOAPIFY =================
    const res = await fetch(
      `https://api.geoapify.com/v1/geocode/reverse?lat=${lat}&lon=${lon}&apiKey=TA_CLE_GEOAPIFY`
    );

    const data = await res.json();
    const address = data.features?.[0]?.properties?.formatted || "Adresse inconnue";

    document.getElementById("address").innerText = address;

    // ================= FIREBASE SAVE =================
    await window.setDoc(window.doc(window.db, "positions", userId), {
      lat,
      lon,
      address,
      time: new Date().toISOString()
    });

  }, (err) => {
    alert("Erreur géolocalisation");
  }, {
    enableHighAccuracy:true
  });
}
</script>

</body>
</html>
