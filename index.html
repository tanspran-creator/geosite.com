<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Position</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

#map {
  height:70vh;
}

button {
  margin:15px;
  padding:12px;
  font-size:16px;
}
</style>
</head>

<body>

<h2>📍 Partager ma position</h2>
<button id="btn">Partager</button>

<p id="status">En attente...</p>
<p id="address"></p>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAgwaKZKvLOW_GYpVirgywWETM4Kjz3dVQ",
  authDomain: "mymaponline-d4fcf.firebaseapp.com",
  projectId: "mymaponline-d4fcf",
  storageBucket: "mymaponline-d4fcf.firebasestorage.app",
  messagingSenderId: "294259967332",
  appId: "1:294259967332:web:d81f81f5122ff5ef626671",
  measurementId: "G-4M4S7687W5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// bouton = déclenche tout
document.getElementById("btn").addEventListener("click", () => {

  if (!navigator.geolocation) {
    alert("GPS non supporté");
    return;
  }

  document.getElementById("status").innerText = "Demande de permission...";

  navigator.geolocation.getCurrentPosition(async (pos) => {

    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    document.getElementById("status").innerText = "Position OK";

    // MAP
    const map = L.map('map').setView([lat, lon], 16);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
      .addTo(map);

    L.marker([lat, lon]).addTo(map);

    // ADRESSE
    let address = "Inconnue";

    try {
      const res = await fetch(
        `https://api.geoapify.com/v1/geocode/reverse?lat=${lat}&lon=${lon}&apiKey=708354c5ad334d41b0611f73996998e1`
      );
      const data = await res.json();
      address = data.features?.[0]?.properties?.formatted || "Inconnue";
    } catch(e){}

    document.getElementById("address").innerText = address;

    // FIREBASE
    await addDoc(collection(db, "logs"), {
      lat,
      lon,
      address,
      userAgent: navigator.userAgent,
      time: new Date().toISOString()
    });

  }, (err) => {

    // GESTION CLAIRE ERREUR
    if (err.code === 1) {
      alert("❌ Tu as refusé la localisation → autorise-la dans ton navigateur");
    } else {
      alert("Erreur GPS: " + err.message);
    }

  }, {
    enableHighAccuracy: true
  });

});
</script>

</body>
</html>
