<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Live Position</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

#map {
  height:70vh;
}

button {
  margin:15px;
  padding:12px;
  font-size:16px;
  border:none;
  border-radius:8px;
  background:#3b82f6;
  color:white;
}
</style>
</head>

<body>

<h2>📍 Partager ma position</h2>
<button onclick="start()">Partager ma position</button>

<p id="coords">En attente...</p>
<p id="address">Adresse inconnue</p>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAgwaKZKvLOW_GYpVirgywWETM4Kjz3dVQ",
  authDomain: "mymaponline-d4fcf.firebaseapp.com",
  projectId: "mymaponline-d4fcf",
  storageBucket: "mymaponline-d4fcf.firebasestorage.app",
  messagingSenderId: "294259967332",
  appId: "1:294259967332:web:d81f81f5122ff5ef626671",
  measurementId: "G-4M4S7687W5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.sendToFirebase = async (data) => {
  try {
    await addDoc(collection(db, "logs"), data);
    console.log("OK Firebase");
  } catch(e){
    console.error(e);
    alert("Erreur Firebase: " + e.message);
  }
};
</script>

<script>
let map;
let marker;

function start(){

  if (!navigator.geolocation) {
    alert("Géolocalisation non supportée");
    return;
  }

  navigator.geolocation.watchPosition(async (pos) => {

    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    document.getElementById("coords").innerText =
      `Lat: ${lat} | Lon: ${lon}`;

    // MAP
    if (!map) {
      map = L.map('map').setView([lat, lon], 16);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
        .addTo(map);

      marker = L.marker([lat, lon]).addTo(map);
    } else {
      map.setView([lat, lon]);
      marker.setLatLng([lat, lon]);
    }

    // GEOAPIFY
    let address = "Inconnue";

    try {
      const res = await fetch(
        `https://api.geoapify.com/v1/geocode/reverse?lat=${lat}&lon=${lon}&apiKey=708354c5ad334d41b0611f73996998e1`
      );

      const data = await res.json();
      address = data.features?.[0]?.properties?.formatted || "Inconnue";
    } catch(e){}

    document.getElementById("address").innerText = address;

    // FIREBASE
    await window.sendToFirebase({
      lat,
      lon,
      address,
      userAgent: navigator.userAgent,
      time: new Date().toISOString()
    });

  }, (err) => {
    alert("Erreur: " + err.message);
  }, {
    enableHighAccuracy: true
  });
}
</script>

</body>
</html>
