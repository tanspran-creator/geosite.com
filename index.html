<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Live Position</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

#map {
  height:70vh;
}

button {
  margin:15px;
  padding:12px;
}
</style>
</head>

<body>

<h2>📍 Partager ma position</h2>

<button onclick="start()">Partager ma position</button>

<p id="coords">En attente...</p>
<p id="address">Adresse inconnue</p>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "TA_CLE",
  authDomain: "TON_PROJET.firebaseapp.com",
  projectId: "TON_PROJET",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.db = db;
window.addDoc = addDoc;
window.collection = collection;
</script>

<script>
let map;
let marker;

function start(){

  if (!navigator.geolocation) {
    alert("Géolocalisation non supportée");
    return;
  }

  navigator.geolocation.watchPosition(async (pos) => {

    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    document.getElementById("coords").innerText =
      `Lat: ${lat} | Lon: ${lon}`;

    // MAP
    if (!map) {
      map = L.map('map').setView([lat, lon], 16);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
        .addTo(map);

      marker = L.marker([lat, lon]).addTo(map);
    } else {
      map.setView([lat, lon]);
      marker.setLatLng([lat, lon]);
    }

    // ADRESSE
    let address = "Inconnue";

    try {
      const res = await fetch(
        `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`
      );
      const data = await res.json();
      address = data.display_name || "Inconnue";
    } catch(e){}

    document.getElementById("address").innerText = address;

    // FIREBASE LOG
    await window.addDoc(window.collection(window.db, "logs"), {
      lat,
      lon,
      address,
      userAgent: navigator.userAgent,
      time: new Date().toISOString()
    });

  }, (err) => {
    alert("Erreur : " + err.message);
  }, {
    enableHighAccuracy: true
  });
}
</script>

</body>
</html>
